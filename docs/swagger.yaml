basePath: /
definitions:
  catalog.Card:
    properties:
      abilities:
        items:
          type: object
        type: array
      artist:
        type: string
      attacks:
        items:
          type: object
        type: array
      color_identity:
        items:
          type: string
        type: array
      colors:
        description: MTG
        items:
          type: string
        type: array
      evolves_from:
        items:
          type: string
        type: array
      expansion:
        $ref: '#/definitions/catalog.Expansion'
      expansion_sort_order:
        type: integer
      external_id:
        type: string
      faces:
        items:
          type: object
        type: array
      flavor_text:
        type: string
      hp:
        type: string
      images:
        items:
          $ref: '#/definitions/catalog.Image'
        type: array
      keywords:
        items:
          type: string
        type: array
      layout:
        type: string
      mana_cost:
        type: string
      mana_value:
        type: integer
      name:
        type: string
      national_pokedex_numbers:
        items:
          type: integer
        type: array
      number:
        type: string
      power:
        type: string
      printed_number:
        type: string
      rarity:
        type: string
      rarity_code:
        type: string
      resistances:
        items:
          type: object
        type: array
      retreat_cost:
        items:
          type: string
        type: array
      rules:
        items:
          type: string
        type: array
      rulings:
        items:
          type: object
        type: array
      subtypes:
        items:
          type: string
        type: array
      supertype:
        type: string
      toughness:
        type: string
      type_line:
        type: string
      types:
        items:
          type: string
        type: array
      variants:
        items:
          $ref: '#/definitions/catalog.Variant'
        type: array
      weaknesses:
        items:
          type: object
        type: array
    type: object
  catalog.CardSummary:
    properties:
      expansion:
        $ref: '#/definitions/catalog.ExpansionBrief'
      external_id:
        type: string
      game_code:
        type: string
      id:
        type: integer
      image:
        $ref: '#/definitions/catalog.ImageBrief'
      name:
        type: string
      number:
        type: string
      rarity:
        type: string
      stock:
        description: |-
          Stock agregado de listings activos con cantidad > 0. El catálogo
          público solo muestra cartas con stock disponible.
        type: integer
      variants:
        items:
          $ref: '#/definitions/catalog.VariantBrief'
        type: array
    type: object
  catalog.Expansion:
    properties:
      code:
        type: string
      external_id:
        type: string
      game_id:
        type: integer
      id:
        type: integer
      logo:
        type: string
      name:
        type: string
      printed_total:
        type: integer
      release_date:
        type: string
      series:
        type: string
      symbol:
        type: string
      total:
        type: integer
    type: object
  catalog.ExpansionBrief:
    properties:
      code:
        type: string
      id:
        type: integer
      logo_url:
        type: string
      name:
        type: string
      symbol_url:
        type: string
    type: object
  catalog.Image:
    properties:
      large:
        type: string
      medium:
        type: string
      small:
        type: string
      type:
        type: string
    type: object
  catalog.ImageBrief:
    properties:
      large:
        type: string
      medium:
        type: string
      small:
        type: string
    type: object
  catalog.ImportedListing:
    properties:
      card_name:
        type: string
      external_id:
        type: string
      game_code:
        type: string
      listing_id:
        type: integer
      merged:
        type: boolean
      price_cop:
        type: number
      price_usd:
        type: number
      quantity:
        type: integer
      status:
        type: string
      variant_name:
        type: string
    type: object
  catalog.Marketplace:
    properties:
      name:
        type: string
      product_id:
        type: string
      purchase_url:
        type: string
    type: object
  catalog.Price:
    properties:
      low_cop:
        type: integer
      low_usd:
        type: number
      market_cop:
        type: integer
      market_usd:
        type: number
      trm_used:
        type: number
    type: object
  catalog.Variant:
    properties:
      images:
        items:
          $ref: '#/definitions/catalog.Image'
        type: array
      marketplaces:
        items:
          $ref: '#/definitions/catalog.Marketplace'
        type: array
      name:
        type: string
      nm_price:
        $ref: '#/definitions/catalog.Price'
      origin:
        type: string
    type: object
  catalog.VariantBrief:
    properties:
      name:
        type: string
      price_cop:
        type: integer
      price_usd:
        type: number
    type: object
  http.createListingRequest:
    properties:
      language:
        type: string
      price_usd:
        type: number
      quantity:
        type: integer
      variant_id:
        type: integer
    type: object
  http.expansionResponse:
    properties:
      Code:
        type: string
      ExternalID:
        type: string
      GameID:
        type: integer
      ID:
        type: integer
      Name:
        type: string
      ReleasedAt:
        type: string
    type: object
  http.gameResponse:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  http.listingResponse:
    properties:
      CardImage:
        type: string
      CardName:
        type: string
      CreatedAt:
        type: string
      ExpansionName:
        type: string
      GameName:
        type: string
      ID:
        type: integer
      Language:
        type: string
      PriceCOP:
        type: number
      PriceUSD:
        type: number
      Quantity:
        type: integer
      SellerID:
        type: integer
      Status:
        type: string
      UpdatedAt:
        type: string
      VariantID:
        type: integer
      VariantName:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API para el catálogo de cartas coleccionables.
  title: Trample API
  version: "1.0"
paths:
  /admin/cards/import:
    post:
      consumes:
      - application/json
      parameters:
      - description: 'Grupos por búsqueda: search_id devuelto + IDs elegidos'
        in: body
        name: body
        required: true
        schema:
          properties:
            groups:
              items:
                properties:
                  external_ids:
                    items:
                      type: string
                    type: array
                  search_id:
                    type: string
                type: object
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              cards:
                items:
                  $ref: '#/definitions/catalog.Card'
                type: array
              imported:
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Importar cartas seleccionadas de búsquedas
      tags:
      - admin
  /admin/cards/import-listing:
    post:
      consumes:
      - application/json
      parameters:
      - description: Grupos por búsqueda con los datos de publicación
        in: body
        name: body
        required: true
        schema:
          properties:
            groups:
              items:
                properties:
                  items:
                    items:
                      properties:
                        external_id:
                          type: string
                        language:
                          type: string
                        price_usd:
                          type: number
                        quantity:
                          type: integer
                      type: object
                    type: array
                  search_id:
                    type: string
                type: object
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              imported:
                type: integer
              listings:
                items:
                  $ref: '#/definitions/catalog.ImportedListing'
                type: array
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Importar cartas y publicarlas al inventario
      tags:
      - admin
  /admin/pokemon/expansions/sync:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              synced:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Sincronizar expansiones Pokémon
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credenciales
        in: body
        name: body
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              token:
                type: string
              user:
                properties:
                  email:
                    type: string
                  first_name:
                    type: string
                  id:
                    type: integer
                  last_name:
                    type: string
                  role:
                    type: string
                type: object
            type: object
        "401":
          description: Credenciales inválidas
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Iniciar sesión
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Datos del nuevo usuario
        in: body
        name: body
        required: true
        schema:
          properties:
            email:
              type: string
            first_name:
              type: string
            last_name:
              type: string
            password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              token:
                type: string
              user:
                properties:
                  email:
                    type: string
                  first_name:
                    type: string
                  id:
                    type: integer
                  last_name:
                    type: string
                  role:
                    type: string
                type: object
            type: object
        "409":
          description: Email ya registrado
          schema:
            properties:
              error:
                type: string
            type: object
        "422":
          description: Datos de validación inválidos
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Registrar usuario
      tags:
      - auth
  /catalog/cards:
    get:
      parameters:
      - description: Código del juego (pokemon, mtg, riftbound)
        in: query
        name: game_code
        type: string
      - description: ID de la expansión
        in: query
        name: expansion_id
        type: integer
      - description: Nombre parcial de la carta
        in: query
        name: name
        type: string
      - description: 'Rareza exacta (ej: Rare Holo)'
        in: query
        name: rarity
        type: string
      - description: 'Tipo de carta (ej: Fire para Pokémon, Creature para Magic)'
        in: query
        name: type
        type: string
      - description: Página (default 1)
        in: query
        name: page
        type: integer
      - description: Resultados por página (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              cards:
                items:
                  $ref: '#/definitions/catalog.CardSummary'
                type: array
              page:
                type: integer
              page_size:
                type: integer
              total:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Listar cartas del catálogo
      tags:
      - catalog
  /catalog/pokemon/expansions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/catalog.Expansion'
            type: array
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Listar expansiones Pokémon
      tags:
      - pokemon
  /expansions:
    get:
      parameters:
      - description: ID del juego (opcional)
        in: query
        name: game_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.expansionResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Listar expansiones
      tags:
      - catalog
  /games:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.gameResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Listar juegos
      tags:
      - catalog
  /listings:
    get:
      parameters:
      - default: 50
        description: Límite
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.listingResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar listings
      tags:
      - listings
    post:
      consumes:
      - application/json
      parameters:
      - description: Datos del listing
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.createListingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.listingResponse'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Crear listing
      tags:
      - listings
  /listings/{id}:
    delete:
      parameters:
      - description: ID del listing
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar listing
      tags:
      - listings
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID del listing
        in: path
        name: id
        required: true
        type: integer
      - description: Nueva cantidad (0 = inactivo)
        in: body
        name: body
        required: true
        schema:
          properties:
            quantity:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.listingResponse'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar cantidad de un listing
      tags:
      - listings
  /scrydex/magic/cards:
    post:
      consumes:
      - application/json
      parameters:
      - description: Filtros (name es requerido)
        in: body
        name: body
        schema:
          properties:
            expansion_code:
              type: string
            name:
              type: string
            rarity:
              type: string
            type:
              type: string
            variants:
              items:
                type: string
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              cards:
                items:
                  $ref: '#/definitions/catalog.Card'
                type: array
              search_id:
                type: string
              total:
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Buscar cartas Magic
      tags:
      - magic
  /scrydex/pokemon/cards:
    post:
      consumes:
      - application/json
      parameters:
      - description: Filtros de búsqueda (name es requerido)
        in: body
        name: body
        schema:
          properties:
            expansion_code:
              type: string
            name:
              type: string
            rarity:
              type: string
            supertype:
              type: string
            type:
              type: string
            variants:
              items:
                type: string
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              cards:
                items:
                  $ref: '#/definitions/catalog.Card'
                type: array
              search_id:
                type: string
              total:
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Buscar cartas Pokémon
      tags:
      - pokemon
  /scrydex/pokemon/cards/{id}:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID de la carta
        in: path
        name: id
        required: true
        type: string
      - description: Variantes
        in: body
        name: body
        schema:
          properties:
            variants:
              items:
                type: string
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.Card'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Obtener carta Pokémon por ID
      tags:
      - pokemon
  /scrydex/riftbound/cards:
    post:
      consumes:
      - application/json
      parameters:
      - description: Filtros (name es requerido)
        in: body
        name: body
        schema:
          properties:
            expansion_code:
              type: string
            name:
              type: string
            rarity:
              type: string
            type:
              type: string
            variants:
              items:
                type: string
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              cards:
                items:
                  $ref: '#/definitions/catalog.Card'
                type: array
              search_id:
                type: string
              total:
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Buscar cartas Riftbound
      tags:
      - riftbound
  /scrydex/riftbound/cards/{id}:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID de la carta
        in: path
        name: id
        required: true
        type: string
      - description: Variantes
        in: body
        name: body
        schema:
          properties:
            variants:
              items:
                type: string
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.Card'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Obtener carta Riftbound por ID
      tags:
      - riftbound
securityDefinitions:
  BearerAuth:
    description: 'Ingresá el token con el prefijo Bearer. Ej: "Bearer eyJ..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
