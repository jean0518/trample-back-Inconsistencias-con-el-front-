        type: array
      artist:
        type: string
      attacks:
        items:
          type: object
        type: array
      evolves_from:
        items:
          type: string
        type: array
      expansion:
        $ref: '#/definitions/catalog.Expansion'
      expansion_sort_order:
        type: integer
      external_id:
        type: string
      flavor_text:
        type: string
      hp:
        type: string
      images:
        items:
          $ref: '#/definitions/catalog.Image'
        type: array
      language:
        type: string
      language_code:
        type: string
      name:
        type: string
      national_pokedex_numbers:
        items:
          type: integer
        type: array
      number:
        type: string
      printed_number:
        type: string
      rarity:
        type: string
      rarity_code:
        type: string
      resistances:
        items:
          type: object
        type: array
      retreat_cost:
        items:
          type: string
        type: array
      subtypes:
        items:
          type: string
        type: array
      supertype:
        type: string
      types:
        items:
          type: string
        type: array
      variants:
        items:
          $ref: '#/definitions/catalog.Variant'
        type: array
      weaknesses:
        items:
          type: object
        type: array
    type: object
  catalog.Expansion:
    properties:
      code:
        type: string
      external_id:
        type: string
      language:
        type: string
      language_code:
        type: string
      logo:
